<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Hotspot Billing System - Client Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF for client-side PDF generation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-cyan-500 selection:text-slate-950">

    <!-- Header / Navbar -->
    <header class="bg-slate-900/85 backdrop-blur-md border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-3 h-3 bg-cyan-400 rounded-full animate-pulse"></div>
                <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-cyan-400 to-indigo-500 bg-clip-text text-transparent">VORTEX PORTAL</h1>
            </div>
            <div id="nav-user-info" class="hidden flex items-center space-x-4">
                <span id="nav-username" class="text-sm font-medium text-slate-300"></span>
                <button onclick="logout()" class="bg-rose-600/20 hover:bg-rose-600 text-rose-400 hover:text-white px-3 py-1.5 text-xs font-semibold rounded-lg border border-rose-500/30 transition">Logout</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto p-4 w-full flex-grow flex items-center justify-center my-6">

        <!-- AUTH SECTION -->
        <div id="auth-section" class="w-full max-w-md bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-6 shadow-2xl">
            <div class="flex border-b border-slate-800 mb-6">
                <button id="tab-login" onclick="switchTab('login')" class="flex-1 pb-3 font-bold text-cyan-400 border-b-2 border-cyan-400 transition">Login</button>
                <button id="tab-register" onclick="switchTab('register')" class="flex-1 pb-3 font-semibold text-slate-400 hover:text-slate-200 transition">Register</button>
            </div>

            <!-- Login Form -->
            <form id="form-login" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email or Username</label>
                    <input type="text" id="login-identifier" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                    <input type="password" id="login-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 font-bold py-3.5 rounded-xl text-slate-950 shadow-lg transition">Login</button>
            </form>

            <!-- Register Form -->
            <form id="form-register" onsubmit="handleRegister(event)" class="space-y-4 hidden">
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Full Name</label>
                    <input type="text" id="reg-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Username</label>
                    <input type="text" id="reg-username" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Email Address</label>
                    <input type="email" id="reg-email" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Phone Number</label>
                    <input type="text" id="reg-phone" placeholder="2547XXXXXXXX" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1.5">Password</label>
                    <input type="password" id="reg-password" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-white placeholder-slate-600 focus:outline-none focus:border-cyan-500 transition">
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 font-bold py-3.5 rounded-xl text-slate-950 shadow-lg transition">Register Tenant</button>
            </form>
            <div id="auth-alert" class="mt-4 text-center text-xs font-medium text-rose-400 min-h-[20px]"></div>
        </div>

        <!-- TENANT DASHBOARD SECTION -->
        <div id="tenant-dashboard" class="w-full space-y-6 hidden">
            <div class="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <h2 class="text-sm font-bold uppercase tracking-wider text-cyan-400">Tenant Control Panel</h2>
                <p class="text-slate-300 text-sm">Welcome back, <span id="tenant-display-name" class="font-bold text-white"></span>!</p>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800 space-y-3">
                    <h3 class="text-xs font-semibold uppercase tracking-wider text-slate-400">Update Profile / Business Details</h3>
                    <input type="text" id="update-business" placeholder="Business Name" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-white">
                    <input type="text" id="update-phone" placeholder="Phone Number" class="w-full bg-slate-900 border border-slate-800 rounded-lg p-2.5 text-xs text-white">
                    <button onclick="updateTenantProfile()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 text-xs font-bold px-4 py-2 rounded-lg transition">Save Changes</button>
                </div>
            </div>
        </div>

        <!-- SUPER ADMIN DASHBOARD SECTION -->
        <div id="admin-dashboard" class="w-full space-y-6 hidden">
            <div class="bg-slate-900/90 backdrop-blur border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
                <div class="flex justify-between items-center">
                    <h2 class="text-sm font-bold uppercase tracking-wider text-indigo-400">Super Admin Directory</h2>
                    <button onclick="downloadTenantPDF()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-4 py-2 rounded-xl transition shadow-lg">Download PDF Report</button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-slate-950 text-slate-400 uppercase font-semibold">
                            <tr>
                                <th class="p-3">Name</th>
                                <th class="p-3">Username</th>
                                <th class="p-3">Email</th>
                                <th class="p-3">Phone</th>
                                <th class="p-3">Registered</th>
                            </tr>
                        </thead>
                        <tbody id="admin-tenant-list" class="divide-y divide-slate-800"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-900/50 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        &copy; 2026 Vortex Hotspot Billing System. Hosted on GitHub Pages.
    </footer>

    <!-- Client-Side Storage & Logic Script -->
    <script>
        const SUPER_ADMIN_EMAIL = 'fidelsteven2@gmail.com';
        const SUPER_ADMIN_PASS = 'Steven_19.20.06';

        window.addEventListener('DOMContentLoaded', () => {
            // Seed a default admin or test tenant if storage is empty
            if (!localStorage.getItem('vortex_tenants')) {
                localStorage.setItem('vortex_tenants', JSON.stringify([
                    { name: 'Demo Tenant', username: 'demo', email: 'demo@vortex.com', phone: '254712345678', business_name: 'Demo Hotspot', password: 'password123', created_at: new Date().toISOString() }
                ]));
            }

            const session = localStorage.getItem('vortex_session');
            if (session) {
                const data = JSON.parse(session);
                if (data.role === 'SUPER_ADMIN') {
                    showSuperAdminDashboard();
                } else {
                    showTenantDashboard(data.username);
                }
            }
        });

        function switchTab(tab) {
            const loginForm = document.getElementById('form-login');
            const regForm = document.getElementById('form-register');
            document.getElementById('auth-alert').innerText = '';

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                regForm.classList.add('hidden');
                document.getElementById('tab-login').className = 'flex-1 pb-3 font-bold text-cyan-400 border-b-2 border-cyan-400 transition';
                document.getElementById('tab-register').className = 'flex-1 pb-3 font-semibold text-slate-400 transition';
            } else {
                loginForm.classList.add('hidden');
                regForm.classList.remove('hidden');
                document.getElementById('tab-register').className = 'flex-1 pb-3 font-bold text-cyan-400 border-b-2 border-cyan-400 transition';
                document.getElementById('tab-login').className = 'flex-1 pb-3 font-semibold text-slate-400 transition';
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value;
            const alertBox = document.getElementById('auth-alert');

            // Check Super Admin
            if (identifier === SUPER_ADMIN_EMAIL && password === SUPER_ADMIN_PASS) {
                localStorage.setItem('vortex_session', JSON.stringify({ role: 'SUPER_ADMIN' }));
                showSuperAdminDashboard();
                return;
            }

            // Check Tenants
            const tenants = JSON.parse(localStorage.getItem('vortex_tenants') || '[]');
            const tenant = tenants.find(t => (t.email === identifier || t.username === identifier) && t.password === password);

            if (tenant) {
                localStorage.setItem('vortex_session', JSON.stringify({ role: 'TENANT', username: tenant.username }));
                showTenantDashboard(tenant.username);
            } else {
                alertBox.innerText = 'Invalid credentials. Please check and try again.';
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            const name = document.getElementById('reg-name').value.trim();
            const username = document.getElementById('reg-username').value.trim();
            const email = document.getElementById('reg-email').value.trim();
            const phone = document.getElementById('reg-phone').value.trim();
            const password = document.getElementById('reg-password').value;
            const alertBox = document.getElementById('auth-alert');

            if (email === SUPER_ADMIN_EMAIL) {
                alertBox.innerText = 'This email address is reserved for system administration.';
                return;
            }

            let tenants = JSON.parse(localStorage.getItem('vortex_tenants') || '[]');
            if (tenants.some(t => t.email === email || t.username === username)) {
                alertBox.innerText = 'Username or email already exists.';
                return;
            }

            tenants.push({ name, username, email, phone, business_name: name + ' Hotspot', password, created_at: new Date().toISOString() });
            localStorage.setItem('vortex_tenants', JSON.stringify(tenants));

            alert('Registration successful! Please log in.');
            switchTab('login');
        }

        function showTenantDashboard(username) {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('tenant-dashboard').classList.remove('hidden');
            document.getElementById('nav-user-info').classList.remove('hidden');
            document.getElementById('nav-username').innerText = username;
            document.getElementById('tenant-display-name').innerText = username;

            const tenants = JSON.parse(localStorage.getItem('vortex_tenants') || '[]');
            const tenant = tenants.find(t => t.username === username);
            if (tenant) {
                document.getElementById('update-business').value = tenant.business_name || '';
                document.getElementById('update-phone').value = tenant.phone || '';
            }
        }

        function updateTenantProfile() {
            const session = JSON.parse(localStorage.getItem('vortex_session') || '{}');
            let tenants = JSON.parse(localStorage.getItem('vortex_tenants') || '[]');
            const index = tenants.findIndex(t => t.username === session.username);

            if (index !== -1) {
                tenants[index].business_name = document.getElementById('update-business').value;
                tenants[index].phone = document.getElementById('update-phone').value;
                localStorage.setItem('vortex_tenants', JSON.stringify(tenants));
                alert('Contact details updated successfully!');
            }
        }

        function showSuperAdminDashboard() {
            document.getElementById('auth-section').classList.add('hidden');
            document.getElementById('admin-dashboard').classList.remove('hidden');
            document.getElementById('nav-user-info').classList.remove('hidden');
            document.getElementById('nav-username').innerText = 'Super Admin';

            const tenants = JSON.parse(localStorage.getItem('vortex_tenants') || '[]');
            const tbody = document.getElementById('admin-tenant-list');
            tbody.innerHTML = '';

            tenants.forEach(t => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 font-medium text-white">${t.name}</td>
                    <td class="p-3">${t.username}</td>
                    <td class="p-3">${t.email}</td>
                    <td class="p-3">${t.phone}</td>
                    <td class="p-3">${new Date(t.created_at).toLocaleDateString()}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function downloadTenantPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const tenants = JSON.parse(localStorage.getItem('vortex_tenants') || '[]');

            doc.setFontSize(16);
            doc.text('Vortex Hotspot - Registered Tenants Directory', 14, 20);
            doc.setFontSize(10);
            doc.text('Generated via Client-Side Portal', 14, 28);

            let y = 40;
            doc.setFont(undefined, 'bold');
            doc.text('Name', 14, y);
            doc.text('Username', 60, y);
            doc.text('Email', 100, y);
            doc.text('Phone', 160, y);
            doc.line(14, y + 2, 195, y + 2);

            doc.setFont(undefined, 'normal');
            tenants.forEach(t => {
                y += 10;
                if (y > 280) { doc.addPage(); y = 20; }
                doc.text(t.name.substring(0, 20), 14, y);
                doc.text(t.username.substring(0, 15), 60, y);
                doc.text(t.email.substring(0, 25), 100, y);
                doc.text(t.phone, 160, y);
            });

            doc.save('vortex_registered_tenants.pdf');
        }

        function logout() {
            localStorage.removeItem('vortex_session');
            location.reload();
        }
    </script>
</body>
</html>
